# In-memory H2 in PostgreSQL compatibility mode. Keeps @SpringBootTest runnable
# (notably contextLoads) without a live PostgreSQL on localhost:5432.
spring.datasource.url=jdbc:h2:mem:ims_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Test-classpath application.properties replaces the main one, so required
# properties must be restated here (JwtUtils fails fast without a secret).
# 44 bytes >= the 32-byte HMAC-SHA256 minimum.
secreteJwtString=test-only-signing-secret-0123456789abcdef0123456789abcdef
jwt.expiration-minutes=60
app.cors.allowed-origins=http://localhost:3000

server.port=0
