spring.application.name=InventoryManagementSystem
server.port=5050

# Supabase PostgreSQL — use with SPRING_PROFILES_ACTIVE=supabase.
# Never commit real credentials. Set env vars:
#   DB_URL, DB_USERNAME (postgres.<project-ref>), DB_PASSWORD
# Get the Transaction Pooler host from Supabase Dashboard -> Database -> Connect -> Transaction Pooler (port 6543)
# Example: DB_URL=jdbc:postgresql://aws-0-<region>.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

app.cors.allowed-origins=http://localhost:3000,https://hms-ewuyl86dv-kalandhars2004-9900s-projects.vercel.app,https://hms-fg-git-kalandharcode-kalandhars2004-9900s-projects.vercel.app,https://*.vercel.app
secretJwtString=${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789}
secreteJwtString=${secretJwtString}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
