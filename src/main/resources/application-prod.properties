# Production profile.
#
# Every value here is required from the environment — there are no defaults, so the
# application fails fast on boot rather than silently running with tutorial secrets.
#
# Required environment variables:
#   DB_URL, DB_USERNAME, DB_PASSWORD
#   JWT_SECRET                (>= 32 bytes)
#   APP_CORS_ALLOWED_ORIGINS  (comma separated, no wildcards)

server.port=${SERVER_PORT:5050}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Pool sizing env-overridable so it can be tuned per deployment without a rebuild.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:15}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# `validate`, never `update`. Schema changes belong in migrations; auto-DDL in
# production silently diverges and cannot be rolled back.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

secretJwtString=${JWT_SECRET}
secreteJwtString=${secretJwtString}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# Do not echo internals to clients.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
