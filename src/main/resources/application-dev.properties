spring.application.name=InventoryManagementSystem
server.port=5050

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_db
spring.datasource.username=inventory
spring.datasource.password=inventory123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 2GB was a trivial DoS vector. Product images do not need more than a few MB.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# NOTE: secreteJwtString is deliberately NOT set here. It used to be, which silently
# shadowed the ${JWT_SECRET} placeholder in application.properties and made the
# environment override dead code in every environment.

app.cors.allowed-origins=http://localhost:3000