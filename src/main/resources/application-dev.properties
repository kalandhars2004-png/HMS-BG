spring.application.name=InventoryManagementSystem
server.port=5050

# Supabase PostgreSQL — No H2 again daa (entirely removed)
spring.datasource.url=jdbc:postgresql://db.beljlvogtyphybqaqzql.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=9025Vino@123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

app.cors.allowed-origins=http://localhost:3000

# DevTools auto-restart — run once, changes rebuild automatically (nanba: one time run daa)
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
