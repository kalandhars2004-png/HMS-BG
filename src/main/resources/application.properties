spring.application.name=InventoryManagementSystem
server.port=5050

# Override with -Dspring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Dev-only fallback so a fresh checkout boots. The prod profile has no default and
# will refuse to start without JWT_SECRET set. Must be >= 32 bytes for HMAC-SHA256.
secreteJwtString=${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789}

# Token lifetime. There is no refresh token and no revocation, so keep this short.
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:720}
